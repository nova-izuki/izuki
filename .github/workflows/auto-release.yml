name: Auto release on version bump

# When main gets a new version (package.json) AND that exact commit passed
# "Verify companion changes", tag it and start the Windows and phone builds,
# so the website's Download button and the app's own updater get the new
# version without anyone pushing a tag by hand.
#
# It waits for Verify instead of starting on the push: a version bump whose
# tests fail is never tagged. A later fix on main at the same version is
# released once its tests pass.
on:
  workflow_run:
    workflows: ["Verify companion changes"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  tag:
    # Only a Verify that passed, for a push to this repository's own main.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Choose the verified commit
        id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          sha="${RUN_SHA:-$GITHUB_SHA}"
          # Started by hand: the same rule, Verify must have passed for it.
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$sha&status=success&event=push" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "Verify has not passed for $sha; not releasing." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tag the new version and start the builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          # The commit must still be on main (not a branch that was force-moved).
          git fetch origin main
          git merge-base --is-ancestor "$SHA" origin/main || { echo "$SHA is not on main; not releasing." >&2; exit 1; }
          # Every version file agrees, the release notes exist, and it's newer
          # than what users have now (never a sideways or backwards release).
          latest=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//' || true)
          node tools/check-versions.mjs --release ${latest:+--after "$latest"}
          git tag "$tag" "$SHA"
          git push origin "$tag"
          # A tag pushed with this workflow's token doesn't start other
          # workflows by itself, so start them on the tag directly.
          gh workflow run release.yml --ref "$tag"
          gh workflow run mobile.yml --ref "$tag"
          echo "Started the $tag release from $SHA."
