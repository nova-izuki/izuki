# Publishes Izuki's phone app (mobile/) for free on GitHub Pages, at
# https://nova-izuki.github.io/izuki/ — people open it in Safari or Chrome
# and add it to their home screen. No app store.
#
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Phone app

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/phone-app.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
