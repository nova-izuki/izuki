name: Verify companion changes
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:phone
      - run: npm run test:voice
      - run: npm run test:companion
      - run: npm run test:html
      - run: node tools/browser-check.cjs
        env:
          IZUKI_TEST_BROWSER: /usr/bin/google-chrome
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: npm ci
      - run: npm run build
      - run: npm run icons
      - name: Windows unit tests (Common Controls v6 manifest)
        run: ./tools/test-windows.ps1
