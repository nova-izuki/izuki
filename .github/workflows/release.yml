name: Release Izuki (Windows)

# Push a tag and GitHub builds the installer for you, free, on their runner:
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

# One build per version at a time: a tag push and a hand-started run for the
# same tag used to build side by side and race to publish.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release must be on main (checked below).
          fetch-depth: 0

      - name: Prepare shared draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IZUKI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:IZUKI_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "Select a version tag, not a branch, when releasing" }
          # Only a commit whose tests passed on a push (a pull-request run tests
          # a merge commit, not this one). Auto-release checks this too; this
          # covers a tag pushed by hand.
          $sha = git rev-parse HEAD
          $passed = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/verify.yml/runs?head_sha=$sha&status=success&event=push" --jq '.total_count'
          if ($LASTEXITCODE -ne 0 -or [int]$passed -lt 1) { throw "Verify has not passed for $sha; not building a release from it" }
          # And it must be on main: Verify also passes on milestone branches,
          # and an unmerged milestone is never released.
          git fetch --no-tags origin main
          git merge-base --is-ancestor $sha origin/main
          if ($LASTEXITCODE -ne 0) { throw "$sha is not on main; an unmerged branch is never released" }
          # A published release is never rebuilt or re-uploaded by a re-run.
          $draft = gh release view $env:IZUKI_RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          $exists = $LASTEXITCODE -eq 0
          if ($exists -and $draft -eq 'false') { throw "$env:IZUKI_RELEASE_TAG is already published; a re-run never changes it" }
          if (-not $exists) {
            gh release create $env:IZUKI_RELEASE_TAG --verify-tag --draft --title "Izuki $env:IZUKI_RELEASE_TAG" --notes "Builds are being verified."
            if ($LASTEXITCODE -ne 0) { throw "could not prepare shared release" }
          }

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # The Rust build is the slow part; caching it takes repeat runs from
      # ~12 minutes to about two.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run icons

      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add these in Settings → Secrets → Actions to sign auto-updates.
          # Required for updater artifacts. Never disable signing to release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Izuki ${{ github.ref_name }}"
          releaseBody: |
            ## Izuki — the AI companion that lives on your Windows screen

            Talk to it. It sees your screen, answers out loud, and uses your mouse and keyboard to get things done.

            🌐 **Website, phone app and the easiest download: [nova-izuki.github.io/izuki](https://nova-izuki.github.io/izuki/)**

            **Download `Izuki_*_x64-setup.exe` below and run it.** No admin needed.
            Windows may say "Windows protected your PC" (the app is new and not code-signed yet) → **More info → Run anyway**.

            Then paste a **free** Gemini key in the welcome tour (aistudio.google.com/apikey) — that's the only setup.

            - `Izuki_*_x64-setup.exe` — recommended installer
            - `Izuki_*_x64_en-US.msi` — for IT departments / managed PCs
            - `Izuki-portable.exe` — single file, no install

            Needs Windows 10 (1809+) or 11. macOS and Linux are coming soon.
          # Don't advertise a release until its stable website download exists.
          releaseDraft: true
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      # tauri-action publishes the installers; the portable binary is just the
      # raw executable, so attach that to the same release.
      - name: Attach portable executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $src = "src-tauri/target/x86_64-pc-windows-msvc/release/izuki.exe"
          if (-not (Test-Path $src)) { $src = "src-tauri/target/release/izuki.exe" }
          if (-not (Test-Path $src)) { throw "could not find the built executable" }
          Copy-Item $src "Izuki-portable.exe"
          gh release upload ${{ github.ref_name }} "Izuki-portable.exe" --clobber

      # The website's Download button links straight to this file, so it needs
      # a name that never changes: releases/latest/download/Izuki-Setup.exe.
      - name: Attach Izuki-Setup.exe (stable name for direct downloads)
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $setup = Get-ChildItem -Recurse -Path "src-tauri/target" -Filter "*_x64-setup.exe" | Where-Object { $_.FullName -match "bundle[\\/]nsis" } | Select-Object -First 1
          if (-not $setup) { throw "could not find the NSIS installer" }
          Copy-Item $setup.FullName "Izuki-Setup.exe"
          gh release upload ${{ github.ref_name }} "Izuki-Setup.exe" --clobber

      - name: Publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IZUKI_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Do not move /latest downloads to a release missing any build. A
          # failed iPhone/Android build leaves this release a draft, and the
          # last good release stays the one users get.
          $tag = $env:IZUKI_RELEASE_TAG
          $version = $tag -replace '^v', ''
          # Smallest believable size for each (a failed upload or an empty
          # build is a few bytes, not a missing name).
          $need = @{ 'Izuki-Companion-Android-preview.apk' = 1MB; 'Izuki-Companion-iPhone-sideload.ipa' = 1MB; 'Izuki-Setup.exe' = 10MB; 'Izuki-portable.exe' = 10MB }
          $ready = $false
          for ($attempt = 0; $attempt -lt 180; $attempt++) {
            $sizes = @{}
            foreach ($line in (gh release view $tag --json assets --jq '.assets[] | [.name, (.size|tostring)] | join(" ")')) { $name, $size = $line -split ' ', 2; $sizes[$name] = [long]$size }
            $missing = @($need.Keys | Where-Object { -not $sizes.ContainsKey($_) -or $sizes[$_] -lt $need[$_] })
            if ($LASTEXITCODE -eq 0 -and $missing.Count -eq 0) { $ready = $true; break }
            if ($attempt % 8 -eq 0) { Write-Host "Waiting for: $($missing -join ', ')" }
            Start-Sleep -Seconds 15
          }
          if (-not $ready) { throw "Not every build is ready ($($missing -join ', ')); keeping this release a draft" }
          # A working installer alone is not a working automatic update: check
          # latest.json and every signature the way the app will.
          New-Item -ItemType Directory -Force updater-check | Out-Null
          gh release download $tag --dir updater-check --pattern latest.json --pattern '*.sig' --pattern '*_x64-setup.exe' --pattern '*_x64_en-US.msi' --pattern 'Izuki-Setup.exe'
          if ($LASTEXITCODE -ne 0) { throw "Could not download the updater files to check them; keeping this release a draft" }
          node tools/verify-updater.mjs updater-check $version
          if ($LASTEXITCODE -ne 0) { throw "The updater files did not verify; keeping this release a draft" }
          # The website's download must be this release's own installer.
          $setup = Get-ChildItem updater-check -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $setup -or (Get-FileHash $setup.FullName).Hash -ne (Get-FileHash updater-check/Izuki-Setup.exe).Hash) { throw "Izuki-Setup.exe is not this release's installer" }
          # Never publish behind a newer release (it would move the website's
          # download backwards).
          $current = gh release view --json tagName --jq '.tagName' 2>$null
          if ($LASTEXITCODE -eq 0 -and $current -and [version]($current -replace '^v', '') -ge [version]$version) { throw "$current is already out; not publishing the older $tag" }
          $notes = "docs/RELEASE-$version.md"
          if (Test-Path $notes) {
            # Every release page leads to the website first — so search
            # engines see the site as Izuki's home, not 40 GitHub pages.
            $page = "🌐 **Izuki's website — download, phone app and TV app: [nova-izuki.github.io/izuki](https://nova-izuki.github.io/izuki/)**`n`n" + (Get-Content $notes -Raw)
            $page | Set-Content -Encoding utf8 release-notes.md
            gh release edit $tag --notes-file release-notes.md
            if ($LASTEXITCODE -ne 0) { throw "could not attach release notes" }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "could not publish complete release" }
