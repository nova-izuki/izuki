name: Build Izuki Companion mobile apps

on:
  push:
    branches: ['codex/mobile-foundation']
  pull_request:
    paths: ['android/**', 'ios/**', 'docs/app/**', 'capacitor.config.ts', 'package*.json', '.github/workflows/mobile.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Companion APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x ./gradlew
        working-directory: android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: Izuki-Companion-Android-preview
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios-project:
    name: iPhone project integrity
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx cap sync ios
      - run: xcodebuild -list -project ios/App/App.xcodeproj
