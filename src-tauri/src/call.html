<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Call Izuki</title>
<style>
  :root {
    color-scheme: dark;
    --ground: #0e0e13;
    --ink: #ecebf5;
    --muted: #9ea0ad;
    --violet: #7c5cff;
    --teal: #4ecdc4;
    --line: rgba(255, 255, 255, 0.09);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(120% 70% at 10% -10%, rgba(124, 92, 255, 0.28), transparent 60%),
      radial-gradient(110% 60% at 110% 110%, rgba(78, 205, 196, 0.22), transparent 60%),
      var(--ground);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  header { padding-block: 18px 6px; text-align: center; }
  header h1 { margin: 0; font-size: 17px; letter-spacing: 0.14em; font-weight: 700;
    background: linear-gradient(90deg, #a78bfa, var(--teal)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #state { margin-top: 4px; color: var(--muted); font-size: 13px; min-height: 1.4em; }
  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-block: 12px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .me { align-self: flex-end; background: linear-gradient(135deg, rgba(124, 92, 255, 0.85), rgba(78, 205, 196, 0.7)); color: #fff; border-bottom-right-radius: 6px; }
  .izuki { align-self: flex-start; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .izuki a { display: inline-block; margin-top: 8px; color: var(--ground); background: var(--teal); padding: 5px 12px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 13px; }
  .hint { color: var(--muted); text-align: center; font-size: 13px; margin: auto 0; padding: 0 12px; }
  footer { display: flex; flex-direction: column; align-items: center; gap: 10px; padding-block: 12px 22px; }
  #orb {
    width: 108px; height: 108px; border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 35% 30%, #b8a6ff, var(--violet) 45%, #2b6f8f 100%);
    box-shadow: 0 0 0 0 rgba(124, 92, 255, 0.5), 0 18px 40px rgba(0, 0, 0, 0.5);
    color: #fff; font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
    transition: transform 0.2s ease;
  }
  #orb:focus-visible { outline: 3px solid var(--teal); outline-offset: 4px; }
  #orb.listening { animation: pulse 1.4s ease-in-out infinite; background: radial-gradient(circle at 35% 30%, #a7fff6, var(--teal) 45%, #1d5e6b 100%); }
  #orb.thinking { animation: spin 1.2s linear infinite; }
  #orb.speaking { animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
  @keyframes spin { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { #orb { animation: none !important; } }
  #end { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 13px; }
  #typed { display: flex; gap: 6px; width: 100%; max-width: 480px; }
  #text { flex: 1; min-width: 0; background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line); color: var(--ink); border-radius: 18px; padding: 9px 14px; font: inherit; }
  #send { background: var(--violet); color: #fff; border: 0; border-radius: 18px; padding: 0 16px; font: inherit; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>IZUKI</h1>
  <div id="state">Tap the circle and talk</div>
</header>
<main id="log">
  <p class="hint" id="hint">Hands-free: tap once, then just talk back and forth. Izuki can chat, set reminders, check your apps, or do things on your PC.</p>
</main>
<footer>
  <button id="orb" type="button" aria-label="Talk to Izuki">TALK</button>
  <button id="end" type="button" hidden>End call</button>
  <form id="typed" autocomplete="off">
    <input id="text" placeholder="…or type here" aria-label="Type a message">
    <button id="send" type="submit">Send</button>
  </form>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const orb = $("orb"), state = $("state"), log = $("log"), endBtn = $("end");
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let inCall = false, busy = false, recog = null, recorder = null;

  const setState = (mode, text) => {
    orb.className = mode || "";
    orb.textContent = mode === "listening" ? "LISTENING" : mode === "thinking" ? "…" : mode === "speaking" ? "IZUKI" : "TALK";
    state.textContent = text;
  };

  const add = (who, text, links) => {
    $("hint")?.remove();
    const div = document.createElement("div");
    div.className = "msg " + who;
    div.textContent = text;
    for (const [name, url] of links || []) {
      const a = document.createElement("a");
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = "Connect " + name;
      div.appendChild(document.createElement("br"));
      div.appendChild(a);
    }
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
  };

  // Izuki's voice: this phone's own, so it costs nothing.
  const say = (text) => new Promise((done) => {
    if (!("speechSynthesis" in window) || !text) return done();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
    u.rate = 1.05;
    u.onend = done; u.onerror = done;
    setState("speaking", "Izuki is talking — tap to cut in");
    speechSynthesis.speak(u);
  });

  const ask = async (text) => {
    if (!text.trim()) return listenAgain();
    busy = true;
    add("me", text);
    setState("thinking", "Thinking…");
    try {
      const r = await fetch("talk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
      const v = await r.json();
      add("izuki", v.text || "Hmm, I lost my words there.", v.links);
      await say(v.text);
    } catch (e) {
      add("izuki", "I can't reach your PC right now — is it on and is Izuki running?");
    }
    busy = false;
    listenAgain();
  };

  const listenAgain = () => {
    if (inCall) listen(); else setState("", "Tap the circle and talk");
  };

  // Hearing: this phone's speech recognition where the browser has it,
  // otherwise a recording that Izuki transcribes.
  const listen = () => {
    if (busy) return;
    if (Rec) {
      recog = new Rec();
      recog.lang = navigator.language || "en-US";
      recog.interimResults = true;
      recog.continuous = false;
      let final = "", heardAny = false;
      recog.onresult = (e) => {
        heardAny = true;
        let interim = "";
        for (const r of e.results) (r.isFinal ? (final += r[0].transcript) : (interim += r[0].transcript));
        state.textContent = (final + interim) || "Listening…";
      };
      recog.onerror = (e) => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed") {
          inCall = false; endBtn.hidden = true;
          setState("", "Allow the microphone for this page, then tap again");
        }
      };
      recog.onend = () => {
        recog = null;
        if (!inCall) return setState("", "Tap the circle and talk");
        if (final.trim()) ask(final.trim());
        else if (!heardAny) setTimeout(() => inCall && !busy && listen(), 250);
        else listen();
      };
      setState("listening", "Listening…");
      try { recog.start(); } catch { setTimeout(listen, 400); }
      return;
    }
    record();
  };

  const record = async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        recorder = null;
        if (!inCall) return;
        const blob = new Blob(chunks, { type: chunks[0]?.type || "audio/webm" });
        setState("thinking", "Working out what you said…");
        try {
          const r = await fetch("hear", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
          const v = await r.json();
          if (v.error) { add("izuki", v.error); inCall = false; endBtn.hidden = true; return setState("", "Tap the circle and talk"); }
          ask(v.text || "");
        } catch { listenAgain(); }
      };
      recorder.start();
      setState("listening", "Listening… tap the circle when you're done");
    } catch {
      inCall = false; endBtn.hidden = true;
      setState("", "Allow the microphone for this page, then tap again");
    }
  };

  orb.addEventListener("click", () => {
    // Speaking: cut in. Recording (no speech recognition): done talking.
    if (orb.className === "speaking") { speechSynthesis.cancel(); return; }
    if (recorder) { recorder.stop(); return; }
    if (inCall) return;
    inCall = true; endBtn.hidden = false;
    // A silent utterance from the tap unlocks the phone's voice for later.
    if ("speechSynthesis" in window) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
    listen();
  });

  endBtn.addEventListener("click", () => {
    inCall = false; endBtn.hidden = true;
    try { recog?.abort(); } catch {}
    try { recorder?.stop(); } catch {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    setState("", "Call ended — tap to talk again");
  });

  $("typed").addEventListener("submit", (e) => {
    e.preventDefault();
    const t = $("text").value.trim();
    if (!t || busy) return;
    $("text").value = "";
    ask(t);
  });

  // Keep the screen awake during a call where the phone allows it.
  let lock = null;
  const keepAwake = async () => { try { lock = await navigator.wakeLock?.request("screen"); } catch {} };
  orb.addEventListener("click", keepAwake);
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && inCall && keepAwake());
})();
</script>
</body>
</html>
