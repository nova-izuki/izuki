<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Call Izuki">
<title>Call Izuki</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --ground: #05060d;
    --ink: #eef0ff;
    --muted: rgba(214, 219, 255, 0.58);
    --faint: rgba(214, 219, 255, 0.34);
    --line: rgba(255, 255, 255, 0.1);
    --glass: rgba(255, 255, 255, 0.06);
    --cyan: #22d3ee;
    --violet: #8b5cf6;
    --danger: #ff5d73;
    --display: "Sora", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* (SVG icons ignore the hidden attribute without this.) */
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden;
    overscroll-behavior: none;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }

  /* the room: deep space with colour slowly drifting behind the glass */
  .sky { position: fixed; inset: -20%; pointer-events: none; z-index: 0;
    background:
      radial-gradient(40% 35% at 25% 20%, rgba(139, 92, 246, 0.28), transparent 70%),
      radial-gradient(35% 30% at 80% 75%, rgba(34, 211, 238, 0.2), transparent 70%),
      radial-gradient(30% 25% at 70% 15%, rgba(236, 72, 153, 0.14), transparent 70%);
    animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(4%, -3%, 0) rotate(8deg) scale(1.06); } }
  .grid { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.35;
    background-image: linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 75%);
    -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 75%); }

  .app { position: relative; z-index: 1; height: 100%; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 18px); max-width: 560px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: 0.32em;
    background: linear-gradient(90deg, #c4b5fd, var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .live { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 999px; font-size: 12px; letter-spacing: 0.04em;
    background: var(--glass); border: 1px solid var(--line); color: var(--muted); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    font-variant-numeric: tabular-nums; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 10px var(--cyan); }
  .live.off .dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }

  .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #orb-wrap { position: relative; width: min(84vw, 380px, 44vh); aspect-ratio: 1; border: 0; padding: 0; background: none; }
  #orb { width: 100%; height: 100%; display: block; }
  #state { font-family: var(--display); font-weight: 300; font-size: 13px; letter-spacing: 0.28em; text-transform: uppercase; color: var(--muted); min-height: 1.4em; }

  .captions { width: 100%; min-height: 128px; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; text-align: center; padding-inline: 4px; }
  #you { color: var(--faint); font-size: 15px; min-height: 1.3em; }
  #izuki { font-family: var(--display); font-weight: 400; font-size: clamp(18px, 5vw, 22px); line-height: 1.4; letter-spacing: -0.01em; text-wrap: balance;
    max-height: 7.2em; overflow-y: auto; }
  #links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #links a { color: var(--ground); background: linear-gradient(135deg, #a78bfa, var(--cyan)); padding: 7px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; text-decoration: none; }

  .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; padding-top: 14px; }
  .side { width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); display: grid; place-items: center; justify-self: center;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .side svg { width: 20px; height: 20px; }
  #main { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; color: #fff;
    background: linear-gradient(135deg, var(--violet), #2563eb 55%, var(--cyan)); box-shadow: 0 0 0 1px rgba(255,255,255,0.14) inset, 0 14px 40px rgba(99, 102, 241, 0.45); transition: transform 0.2s; }
  #main:active { transform: scale(0.94); }
  #main svg { width: 28px; height: 28px; }
  #main.end { background: linear-gradient(135deg, #ff5d73, #e11d48); box-shadow: 0 14px 40px rgba(225, 29, 72, 0.4); }
  .hint { text-align: center; color: var(--faint); font-size: 12px; margin-top: 10px; min-height: 1.2em; }

  #typed { display: flex; gap: 8px; margin-top: 12px; }
  #typed[hidden] { display: none; }
  #text { flex: 1; min-width: 0; border-radius: 999px; border: 1px solid var(--line); background: rgba(255,255,255,0.05); padding: 12px 18px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #send { border: 0; border-radius: 999px; padding: 0 18px; font-weight: 600; background: linear-gradient(135deg, var(--violet), var(--cyan)); color: #fff; }

  /* the whole conversation, slid up from below */
  #sheet { position: fixed; inset: 0; z-index: 5; background: rgba(5, 6, 13, 0.7); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); display: flex; align-items: flex-end; }
  #sheet[hidden] { display: none; }
  .panel { width: 100%; max-width: 560px; margin: 0 auto; max-height: 78%; overflow-y: auto; border-radius: 26px 26px 0 0; border: 1px solid var(--line);
    background: rgba(18, 19, 34, 0.92); padding: 18px 16px calc(env(safe-area-inset-bottom, 0px) + 18px); display: flex; flex-direction: column; gap: 10px; }
  .panel-head { display: flex; justify-content: space-between; align-items: center; font-family: var(--display); font-size: 15px; font-weight: 600; }
  .panel-head button { border: 1px solid var(--line); background: var(--glass); border-radius: 999px; padding: 6px 14px; }
  #log { display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 9px 13px; border-radius: 18px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 15px; }
  .me { align-self: flex-end; background: linear-gradient(135deg, rgba(139, 92, 246, 0.85), rgba(34, 211, 238, 0.65)); border-bottom-right-radius: 6px; }
  .iz { align-self: flex-start; background: rgba(255,255,255,0.06); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .empty { color: var(--faint); text-align: center; padding: 20px 0; }

  #barge { align-self: center; margin-top: 8px; border: 1px solid var(--line); background: var(--glass); color: var(--muted, #a3a9c7); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; }
  #barge[aria-pressed="true"] { border-color: rgba(52, 211, 153, 0.55); background: rgba(52, 211, 153, 0.14); color: #d1fae5; }
  #orb-wrap { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  @media (prefers-reduced-motion: reduce) { .sky { animation: none; } }
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<div class="grid" aria-hidden="true"></div>

<div class="app">
  <header>
    <span class="brand">IZUKI</span>
    <span class="live" id="live"><span class="dot"></span><span id="live-text">Your PC</span></span>
  </header>

  <main class="stage">
    <button id="orb-wrap" type="button" aria-label="Talk to Izuki"><canvas id="orb"></canvas></button>
    <div id="state">Tap to talk</div>
    <div class="captions" aria-live="polite">
      <div id="you"></div>
      <div id="izuki">Hi — tap the orb and just talk. I can chat, remind you, check your apps, or do things on your PC.</div>
      <div id="links"></div>
    </div>
  </main>

  <div class="controls">
    <button class="side" id="kbd" type="button" aria-label="Type instead">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="3"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 13h.01M18 13h.01M9 13h6"/></svg>
    </button>
    <button id="main" type="button" aria-label="Start talking">
      <svg id="mic-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg>
      <svg id="end-icon" viewBox="0 0 24 24" fill="currentColor" hidden><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28-.28 0-.53-.11-.71-.29L.29 13.08a.996.996 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.39.39.39 1.02 0 1.41l-2.48 2.48c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.28-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.5-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg>
    </button>
    <button class="side" id="mute" type="button" aria-pressed="false" aria-label="Mute Izuki's voice" title="Mute Izuki's voice (it still replies in text)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m23 9-6 6M17 9l6 6"/></svg></button>
    <button class="side" id="history" type="button" aria-label="Show the conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
    </button>
  </div>
  <div class="hint" id="hint">Tap once — then just talk back and forth</div>
  <button id="barge" type="button" aria-pressed="false" title="In a quiet place: just start talking to cut Izuki off. In a noisy place leave it off and hold the orb instead.">🗣️ Talk over Izuki: off</button>
  <form id="typed" autocomplete="off" hidden>
    <input id="text" placeholder="Type to Izuki…" aria-label="Type a message">
    <button id="send" type="submit">Send</button>
  </form>
</div>

<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-label="Conversation">
    <div class="panel-head"><span>Conversation</span><button type="button" id="close-sheet">Done</button></div>
    <div id="log"><div class="empty">Nothing yet — tap the orb and talk.</div></div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  let inCall = false, busy = false, recog = null, recorder = null, mode = "idle";
  let startedAt = 0, clock = null;

  // ------------------------------------------------------------ the orb
  // The same liquid orb as Izuki on the PC: wave-blobs of flowing colour,
  // screened together, rippling with sound. Cool blue listening, violet
  // thinking, warm pink-cyan-green talking.
  const PALETTES = {
    idle:      { colors: ["99,102,241", "34,211,238", "139,92,246", "56,189,248"], glow: "99,102,241", spin: 0.25 },
    listening: { colors: ["6,182,212", "10,132,255", "99,102,241", "34,211,238"], glow: "14,165,233", spin: 0.45 },
    thinking:  { colors: ["147,51,234", "79,70,229", "219,39,119", "124,58,237"], glow: "139,92,246", spin: 1.3 },
    speaking:  { colors: ["236,72,153", "6,182,212", "16,185,129", "139,92,246"], glow: "217,70,239", spin: 0.7 },
  };
  const canvas = $("orb");
  const ctx = canvas.getContext("2d");
  const scratch = document.createElement("canvas");
  const lx = scratch.getContext("2d");
  let SIZE = 300;
  const fit = () => {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    SIZE = canvas.clientWidth || 300;
    for (const c of [canvas, scratch]) { c.width = SIZE * dpr; c.height = SIZE * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    lx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  fit();
  addEventListener("resize", fit);

  let target = 0, level = 0, t = 0, turn = 0, last = performance.now();
  const parse = (col) => col.split(",").map(Number);
  let mix = PALETTES.idle.colors.map(parse), glowMix = parse(PALETTES.idle.glow);
  const rgba = (rgb, a) => `rgba(${rgb.map(Math.round).join(",")},${a})`;
  /** A burst of sound energy (a new word heard, a syllable said). */
  const kick = (v) => (target = Math.min(1, Math.max(target, v)));

  function draw(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    const pal = PALETTES[mode] || PALETTES.idle;
    // Izuki's voice plays as a file (so the silent switch can't mute it),
    // which can't be measured — a syllable-like rhythm stands in for it.
    if (mode === "speaking") kick(0.35 + 0.55 * Math.abs(Math.sin(now / 150) * Math.sin(now / 470)));
    if (mode === "listening") kick(0.08 + 0.05 * Math.sin(now / 600));
    const goal = mode === "thinking" ? 0.22 + 0.08 * Math.sin(now / 380) : mode === "idle" ? 0.05 : target;
    level += (goal - level) * (goal > level ? 0.45 : 0.08);
    target *= 0.9;
    t += dt * (mode === "thinking" ? 1.6 : 1 + level * 2.2);
    turn += dt * (pal.spin + level * 1.2);
    const ease = (from, to) => from.map((v, i) => v + (Number(to.split(",")[i]) - v) * 0.06);
    mix = mix.map((col, i) => ease(col, pal.colors[i]));
    glowMix = ease(glowMix, pal.glow);

    const c = SIZE / 2;
    const R = SIZE * 0.3 * (1 + level * 0.16 + 0.015 * Math.sin(now / 900));
    ctx.globalCompositeOperation = "source-over";
    ctx.clearRect(0, 0, SIZE, SIZE);

    const halo = ctx.createRadialGradient(c, c, R * 0.4, c, c, SIZE / 2);
    halo.addColorStop(0, rgba(glowMix, 0.42 + level * 0.38));
    halo.addColorStop(0.55, rgba(mix[Math.abs(Math.floor(turn / 1.5)) % 4] || mix[0], 0.1 + level * 0.12));
    halo.addColorStop(1, rgba(glowMix, 0));
    ctx.fillStyle = halo;
    ctx.fillRect(0, 0, SIZE, SIZE);

    const body = ctx.createRadialGradient(c, c + R * 0.2, R * 0.1, c, c, R * 1.05);
    body.addColorStop(0, rgba(mix[1], 0.16));
    body.addColorStop(1, "rgba(4,8,22,0.78)");
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(c, c, R * 0.97, 0, Math.PI * 2); ctx.fill();

    ctx.globalCompositeOperation = "screen";
    for (let layer = 0; layer < 3; layer++) {
      const phase = layer * 2.1, amp = 0.05 + level * 0.2, scale = 0.86 + layer * 0.08;
      lx.globalCompositeOperation = "source-over";
      lx.clearRect(0, 0, SIZE, SIZE);
      lx.beginPath();
      for (let i = 0; i <= 120; i++) {
        const a = (i / 120) * Math.PI * 2;
        const wave = Math.sin(a * 2 + t * 1.3 + phase) * 0.5 + Math.sin(a * 3 - t * 1.9 + phase * 1.7) * 0.35
          + Math.sin(a * 5 + t * 2.7 - phase) * 0.25 * (0.3 + level * 1.4) + Math.sin(a * 8 - t * 3.4 + phase) * 0.12 * level;
        const r = R * scale * (1 + amp * wave);
        const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r;
        if (i === 0) lx.moveTo(x, y); else lx.lineTo(x, y);
      }
      lx.closePath();
      const ox = Math.cos(t * 0.7 + phase) * R * 0.16, oy = Math.sin(t * 0.9 + phase) * R * 0.16;
      const dir = layer === 1 ? -1 : 1;
      let flow;
      if (lx.createConicGradient) {
        flow = lx.createConicGradient(turn * dir * (0.8 + layer * 0.25) + phase, c + ox, c + oy);
        for (let k = 0; k <= 4; k++) flow.addColorStop(k / 4, rgba(mix[(k + layer) % 4], 0.78));
      } else {
        flow = lx.createLinearGradient(c - R, c - R, c + R, c + R);
        for (let k = 0; k <= 3; k++) flow.addColorStop(k / 3, rgba(mix[(k + layer) % 4], 0.78));
      }
      lx.fillStyle = flow; lx.fill();
      lx.strokeStyle = rgba(mix[(layer + 2) % 4], 0.35 + level * 0.5); lx.lineWidth = 1.3; lx.stroke();
      lx.globalCompositeOperation = "destination-out";
      const clear = lx.createRadialGradient(c + ox, c + oy, 0, c + ox, c + oy, R * scale * 1.1);
      clear.addColorStop(0, "rgba(0,0,0,0.97)"); clear.addColorStop(0.6, "rgba(0,0,0,0.85)");
      clear.addColorStop(0.88, "rgba(0,0,0,0.3)"); clear.addColorStop(1, "rgba(0,0,0,0)");
      lx.fillStyle = clear; lx.fillRect(0, 0, SIZE, SIZE);
      ctx.drawImage(scratch, 0, 0, SIZE, SIZE);
    }
    for (let k = 0; k < 3; k++) {
      const rr = R * (0.35 + k * 0.18 + 0.05 * Math.sin(t * 0.8 + k));
      ctx.beginPath();
      for (let i = 0; i <= 72; i++) {
        const a = (i / 72) * Math.PI * 2;
        const r = rr * (1 + (0.08 + level * 0.12) * Math.sin(a * (3 + k) + t * (1.2 + k * 0.5)));
        const x = c + Math.cos(a) * r, y = c + Math.sin(a) * r * 0.92;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = `rgba(255,255,255,${0.06 + level * 0.12})`; ctx.lineWidth = 1; ctx.stroke();
    }
    const core = ctx.createRadialGradient(c, c, 0, c, c, R * (0.45 + level * 0.35));
    core.addColorStop(0, `rgba(255,255,255,${0.03 + level * 0.22})`);
    core.addColorStop(0.5, rgba(mix[0], 0.1 + level * 0.22));
    core.addColorStop(1, rgba(mix[0], 0));
    ctx.fillStyle = core; ctx.beginPath(); ctx.arc(c, c, R, 0, Math.PI * 2); ctx.fill();
    ctx.globalCompositeOperation = "source-over";
    const hl = ctx.createRadialGradient(c - R * 0.38, c - R * 0.42, 0, c - R * 0.38, c - R * 0.42, R * 0.55);
    hl.addColorStop(0, "rgba(255,255,255,0.3)"); hl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = hl; ctx.beginPath(); ctx.arc(c, c, R * 0.98, 0, Math.PI * 2); ctx.fill();
    if (ctx.createConicGradient) {
      const rim = ctx.createConicGradient(-turn * 1.4, c, c);
      for (let k = 0; k <= 4; k++) rim.addColorStop(k / 4, rgba(mix[k % 4], 0.35 + level * 0.45));
      ctx.strokeStyle = rim; ctx.lineWidth = 1.4 + level * 1.6; ctx.stroke();
    }
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  // ------------------------------------------------------------ the screen
  const LABELS = { idle: "Tap to talk", listening: "Listening", thinking: "Thinking", speaking: "Izuki" };
  const setMode = (m, hint) => {
    mode = m;
    $("state").textContent = LABELS[m] || "";
    if (hint !== undefined) $("hint").textContent = hint;
  };
  const setCall = (on) => {
    inCall = on;
    $("main").classList.toggle("end", on);
    $("main").setAttribute("aria-label", on ? "End call" : "Start talking");
    $("mic-icon").hidden = on;
    $("end-icon").hidden = !on;
    clearInterval(clock);
    if (on) {
      startedAt = Date.now();
      const tick = () => {
        const s = Math.floor((Date.now() - startedAt) / 1000);
        $("live-text").textContent = `On call · ${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      };
      tick();
      clock = setInterval(tick, 1000);
    } else {
      $("live-text").textContent = "Your PC";
    }
  };
  const setOnline = (ok) => $("live").classList.toggle("off", !ok);

  function remember(who, text, links) {
    const log = $("log");
    const empty = log.querySelector(".empty");
    if (empty) empty.remove();
    const d = document.createElement("div");
    d.className = "msg " + (who === "me" ? "me" : "iz");
    d.textContent = text;
    log.appendChild(d);
    if (who === "me") {
      $("you").textContent = text;
    } else {
      $("izuki").textContent = text;
      const box = $("links");
      box.replaceChildren();
      for (const [name, url] of links || []) {
        const a = document.createElement("a");
        a.href = url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "Connect " + name;
        box.appendChild(a);
      }
    }
  }

  // ------------------------------------------------------------ Izuki's voice
  // The PC sends each reply as audio, played through an <audio> element —
  // which, unlike the browser's own speech, still plays with the iPhone's
  // silent switch on. The phone's own voice is only a fallback.
  const player = new Audio();
  player.setAttribute("playsinline", "");
  // A tiny silent WAV played from the tap unlocks the player, so later
  // replies can play without another tap (an iPhone rule).
  const SILENT = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=";
  const unlockAudio = () => {
    player.src = SILENT;
    player.play().catch(() => {});
    if ("speechSynthesis" in window) {
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0;
      speechSynthesis.speak(u);
    }
  };
  const speakWithPhone = (text) => new Promise((done) => {
    if (!("speechSynthesis" in window) || !text) return done();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[*_#`]/g, ""));
    u.rate = 1.05;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  });
  /** "Talk over Izuki" on: your voice (much louder than Izuki's own echo) cuts it off. */
  function watchBarge() {
    clearInterval(bargeTimer);
    if (!bargeOn || !analyser || !mic) return;
    const began = performance.now();
    let echo = 0, loudMs = 0;
    bargeTimer = setInterval(() => {
      if (mode !== "speaking" || !inCall) { clearInterval(bargeTimer); return; }
      const v = loudness();
      if (v < 0) return;
      // The first half-second is Izuki's own voice coming back in: learn how loud that is.
      if (performance.now() - began < 500) { echo = Math.max(echo, v); return; }
      if (v > Math.max(0.08, echo * 2.2)) {
        loudMs += 60;
        if (loudMs >= 300) { clearInterval(bargeTimer); bargeNext = true; hush(); }
      } else loudMs = Math.max(0, loudMs - 60);
    }, 60);
  }
  const say = (text, audio, type) => new Promise((done) => {
    if (!text) return done();
    if (muted) return done();
    setMode("speaking", bargeOn ? "Just talk to cut me off" : "Tap the orb to stop me · hold it to talk");
    watchBarge();
    if (!audio) return speakWithPhone(text).then(done);
    player.onended = () => done();
    player.onerror = () => speakWithPhone(text).then(done);
    player.src = "data:" + (type || "audio/wav") + ";base64," + audio;
    player.play().catch(() => speakWithPhone(text).then(done));
  });
  const hush = () => {
    clearInterval(bargeTimer);
    try { player.pause(); if (player.onended) player.onended(); } catch {}
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  };

  // ------------------------------------------------------------ asking
  async function ask(text) {
    if (!text.trim()) return listenAgain();
    busy = true;
    remember("me", text);
    $("izuki").textContent = "";
    $("links").replaceChildren();
    setMode("thinking", "Working on it… (tap the orb to cancel)");
    const abort = (talkAbort = new AbortController());
    try {
      const r = await fetch("talk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, voice: true }), signal: abort.signal });
      const v = await r.json();
      setOnline(true);
      talkAbort = null;
      remember("iz", v.text || "Hmm, I lost my words there.", v.links);
      await say(v.text, v.audio, v.audio_type);
    } catch (e) {
      if (!(e && e.name === "AbortError")) {
        setOnline(false);
        remember("iz", "I can't reach your PC right now — is it on, with Izuki open?");
      }
    }
    talkAbort = null;
    busy = false;
    listenAgain();
  }

  /** Tapped (or held) while it's thinking: stop the task on the PC too. */
  function cancelThinking() {
    if (!talkAbort) return;
    talkAbort.abort();
    talkAbort = null;
    fetch("talk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: "stop" }) }).catch(() => {});
    $("izuki").textContent = "Okay — stopped. Go ahead.";
  }

  const listenAgain = () => {
    if (inCall) listen();
    else setMode("idle", "Tap once — then just talk back and forth");
  };

  // ------------------------------------------------------------ hearing
  // Phones only let a page start listening from a tap. "Tap to talk" is one,
  // so the first turn always worked — but every turn after, the page started
  // listening by itself, and the phone (an iPhone especially) quietly
  // refused: "Listening", with nothing heard. So now the microphone is
  // opened once, from that first tap, and stays open for the whole call:
  // the page hears when you start and stop talking, and your PC turns the
  // clip into words (with the free Groq or Gemini key it already has).
  // Without such a key the phone's own recognition is used; where the phone
  // won't restart it by itself, the next turn is a tap on the orb — never a
  // "Listening" that isn't.
  const IOS = /iPhone|iPad|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
  let canHear = null;              // can the PC transcribe a clip? (asked once, at load)
  let mic = null, actx = null, analyser = null, buf = null;
  let vadTimer = null, needTap = false, sendNow = null, turns = 0;
  // Cutting in: tap the orb (stop), hold it (talk over, walkie-talkie
  // style — works anywhere, even somewhere noisy), or, with "Talk over
  // Izuki" on (quiet places), just start talking.
  let bargeOn = false, bargeNext = false, bargeTimer = null, talkAbort = null;
  let holding = false, holdTimer = null, holdRec = null, holdChunks = [], suppressClick = false;
  try { bargeOn = localStorage.getItem("izuki.call.barge") === "1"; } catch {}
  const showBarge = () => {
    $("barge").setAttribute("aria-pressed", String(bargeOn));
    $("barge").textContent = "🗣️ Talk over Izuki: " + (bargeOn ? "on" : "off");
  };
  showBarge();
  $("barge").addEventListener("click", () => {
    bargeOn = !bargeOn;
    try { localStorage.setItem("izuki.call.barge", bargeOn ? "1" : "0"); } catch {}
    showBarge();
    $("hint").textContent = bargeOn ? "Just start talking to cut me off" : "Tap the orb to stop me · hold it to talk over me";
  });

  // Mute: Izuki still hears you and still replies in text, but says nothing.
  let muted = false;
  try { muted = localStorage.getItem("izuki.call.muted") === "1"; } catch {}
  function showMute() {
    const b = $("mute");
    b.setAttribute("aria-pressed", String(muted));
    b.style.color = muted ? "#ff6b81" : "";
    b.setAttribute("aria-label", muted ? "Unmute Izuki's voice" : "Mute Izuki's voice");
  }
  showMute();
  $("mute").addEventListener("click", () => {
    muted = !muted;
    try { localStorage.setItem("izuki.call.muted", muted ? "1" : "0"); } catch {}
    showMute();
    if (muted) hush();
    $("hint").textContent = muted ? "Muted — I'll reply in text" : "Sound's back on";
  });

  fetch("caps").then((r) => r.json()).then((v) => (canHear = !!v.hear)).catch(() => (canHear = false));

  const makeAudioContext = () => {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      actx = actx || new AC();
      if (actx.state !== "running") actx.resume().catch(() => {});
    } catch { actx = null; }
  };
  async function openMic() {
    if (mic && mic.getAudioTracks().some((t) => t.readyState === "live")) return true;
    try {
      mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch { mic = null; return false; }
    try {
      const src = actx.createMediaStreamSource(mic);
      analyser = actx.createAnalyser();
      analyser.fftSize = 1024;
      src.connect(analyser);
      buf = new Float32Array(analyser.fftSize);
    } catch { analyser = null; }
    return true;
  }
  function closeMic() {
    clearInterval(vadTimer); vadTimer = null; sendNow = null;
    try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch {}
    recorder = null;
    if (mic) mic.getTracks().forEach((t) => t.stop());
    mic = null; analyser = null;
  }
  /** How loud the mic is (RMS), or -1 when there's no meter. */
  const loudness = () => {
    if (!analyser) return -1;
    analyser.getFloatTimeDomainData(buf);
    let sum = 0;
    for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
    return Math.sqrt(sum / buf.length);
  };
  const clipType = () =>
    ["audio/webm;codecs=opus", "audio/mp4", "audio/webm", "audio/ogg"].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";

  function tapToTalk(hint) {
    needTap = true;
    setMode("idle", hint || "Tap the orb and talk");
  }

  function listen() {
    if (busy || !inCall || holding) return;
    needTap = false;
    if (canHear && mic && window.MediaRecorder) return hearTurn();
    // The phone's own recognition. On an iPhone it only starts from a tap —
    // the first turn is one; later turns ask for one.
    if (Rec) return turns > 0 && IOS ? tapToTalk() : recognize();
    if (mic || window.MediaRecorder) return record();
    tapToTalk("Type below — this browser can't listen");
  }

  /** One turn with the open mic: wait for speech, record it, send it. */
  function hearTurn() {
    if (busy || !inCall || holding) return;
    turns++;
    // Cut Izuki off by talking: they're mid-sentence already.
    const already = bargeNext;
    bargeNext = false;
    if (actx && actx.state !== "running") actx.resume().catch(() => {});
    setMode("listening", "Just talk — tap the red button to hang up");
    const type = clipType();
    let chunks = [], rec = null, phase = "waiting";
    const begin = () => {
      chunks = [];
      rec = new MediaRecorder(mic, type ? { mimeType: type } : undefined);
      rec.ondataavailable = (e) => e.data && e.data.size && chunks.push(e.data);
      rec.start(250);
      recorder = rec;
    };
    const stop = (keep) => new Promise((done) => {
      if (!rec || rec.state === "inactive") return done(null);
      rec.onstop = () => done(keep && chunks.length ? new Blob(chunks, { type: chunks[0].type || type || "audio/webm" }) : null);
      try { rec.stop(); } catch { done(null); }
    });
    try { begin(); } catch { return tapToTalk(); }

    const STEP = 60;
    let floor = 0.008, loudMs = 0, quietMs = 0, spokeMs = 0, idleMs = 0, deadMs = 0, settleMs = already ? 300 : 0;
    if (already) { phase = "talking"; $("you").textContent = "…"; }
    const finish = async () => {
      if (phase === "done") return;
      phase = "done";
      clearInterval(vadTimer); vadTimer = null; sendNow = null;
      const blob = await stop(true);
      recorder = null;
      if (!inCall) return;
      if (!blob || blob.size < 1200) return hearTurn();
      setMode("thinking", "Working out what you said…");
      try {
        const r = await fetch("hear", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
        const v = await r.json();
        setOnline(true);
        if (v.error) {
          canHear = false;
          remember("iz", v.error);
          return Rec ? tapToTalk() : tapToTalk("Type below");
        }
        if (!(v.text || "").trim()) return hearTurn();
        ask(v.text.trim());
      } catch {
        setOnline(false);
        setTimeout(() => inCall && !busy && hearTurn(), 1500);
      }
    };
    sendNow = finish; // tap the orb to send it straight away
    clearInterval(vadTimer);
    vadTimer = setInterval(async () => {
      if (!inCall || busy || phase === "done") { clearInterval(vadTimer); return; }
      const v = loudness();
      if (v < 0) return; // no meter: the orb tap sends it
      // A meter reading pure silence for seconds is a dead mic, not a quiet
      // room — say so rather than "listening" forever.
      if (v === 0) {
        deadMs += STEP;
        if (deadMs > 3000) { phase = "done"; clearInterval(vadTimer); await stop(false); tapToTalk("Tap the orb and talk"); needTap = true; }
        return;
      }
      deadMs = 0;
      // A moment to let the end of Izuki's own voice die away.
      if ((settleMs += STEP) < 300) { floor = Math.max(floor, Math.min(v, 0.03)); return; }
      const on = Math.max(0.02, floor * 3), off = Math.max(0.013, floor * 2);
      if (phase === "waiting") {
        if (v > on) {
          loudMs += STEP;
          kick(Math.min(1, v * 10));
          if (loudMs >= 180) { phase = "talking"; $("you").textContent = "…"; $("hint").textContent = "Tap the orb when you're done (or just stop talking)"; }
        } else {
          loudMs = 0;
          floor = floor * 0.95 + v * 0.05;
          // Long silence: start a fresh clip, so it stays small.
          if ((idleMs += STEP) > 10000) {
            idleMs = 0;
            phase = "restarting";
            await stop(false);
            if (!inCall || busy) return;
            try { begin(); phase = "waiting"; } catch { phase = "done"; tapToTalk(); }
          }
        }
      } else if (phase === "talking") {
        spokeMs += STEP;
        kick(Math.min(1, v * 10));
        if (v < off) {
          quietMs += STEP;
          if (quietMs >= 900 && spokeMs >= 400) finish();
        } else quietMs = 0;
        if (spokeMs > 30000) finish();
      }
    }, STEP);
  }

  /** The phone's own speech recognition (when the PC can't transcribe). */
  function recognize() {
    turns++;
    recog = new Rec();
    recog.lang = navigator.language || "en-US";
    recog.interimResults = true;
    recog.continuous = false;
    let final = "", heardAny = false, lastLen = 0, started = false;
    recog.onstart = recog.onaudiostart = () => (started = true);
    recog.onresult = (e) => {
      heardAny = started = true;
      let interim = "";
      for (const r of e.results) (r.isFinal ? (final += r[0].transcript) : (interim += r[0].transcript));
      const now = (final + interim).trim();
      // Each new word makes the orb ripple.
      if (now.length > lastLen) kick(0.5 + Math.min(0.5, (now.length - lastLen) / 12));
      lastLen = now.length;
      $("you").textContent = now;
    };
    recog.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        // Refused without a tap (or the mic is off): ask for one.
        if (turns > 1) return tapToTalk();
        setCall(false);
        setMode("idle", "Allow the microphone for this page, then tap again");
      }
    };
    recog.onend = () => {
      recog = null;
      if (!inCall || needTap) return;
      if (final.trim()) ask(final.trim());
      else if (!started) tapToTalk();
      else setTimeout(() => inCall && !busy && listen(), heardAny ? 100 : 250);
    };
    // A recognizer that never actually starts is a refusal too.
    setTimeout(() => {
      if (recog && !started && inCall && !busy) { try { recog.abort(); } catch {} tapToTalk(); }
    }, 3000);
    setMode("listening", "Just talk — tap the red button to hang up");
    try { recog.start(); } catch { tapToTalk(); }
  }

  /** No recognition on this phone and no meter: record until the orb is tapped. */
  async function record() {
    turns++;
    try {
      const stream = mic || (await navigator.mediaDevices.getUserMedia({ audio: true }));
      const chunks = [];
      recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      recorder.onstop = async () => {
        if (stream !== mic) stream.getTracks().forEach((tr) => tr.stop());
        recorder = null;
        if (!inCall) return;
        const blob = new Blob(chunks, { type: chunks[0] ? chunks[0].type : "audio/webm" });
        setMode("thinking", "Working out what you said…");
        try {
          const r = await fetch("hear", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
          const v = await r.json();
          if (v.error) { remember("iz", v.error); setCall(false); return setMode("idle"); }
          ask(v.text || "");
        } catch { listenAgain(); }
      };
      recorder.start();
      setMode("listening", "Tap the orb when you're done");
    } catch {
      setCall(false);
      setMode("idle", "Allow the microphone for this page, then tap again");
    }
  }

  // ------------------------------------------------------------ controls
  let lock = null;
  const keepAwake = async () => { try { lock = await navigator.wakeLock.request("screen"); } catch {} };

  function startCall() {
    setCall(true);
    unlockAudio();
    keepAwake();
    turns = 0;
    // All from inside the tap — the one moment a phone allows it.
    makeAudioContext();
    if (canHear && window.MediaRecorder && navigator.mediaDevices) {
      setMode("listening", "One moment…");
      openMic().then((ok) => (ok ? listen() : (setCall(false), setMode("idle", "Allow the microphone for this page, then tap again"))));
      return;
    }
    listen();
  }
  function endCall() {
    setCall(false);
    needTap = false;
    try { if (recog) recog.abort(); } catch {}
    try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch {}
    closeMic();
    hush();
    try { if (lock) lock.release(); } catch {}
    setMode("idle", "Call ended — tap to talk again");
  }

  $("main").addEventListener("click", () => (inCall ? endCall() : startCall()));
  // The orb itself: cut in while Izuki talks, finish a recording, or start.
  // Hold the orb: talk over Izuki, walkie-talkie style. Let go to send.
  function startHold() {
    holding = true;
    suppressClick = true;
    if (mode === "speaking") hush();
    cancelThinking();
    clearInterval(vadTimer); vadTimer = null; sendNow = null; needTap = false;
    try { if (recog) recog.abort(); } catch {}
    try { if (recorder && recorder.state !== "inactive") { recorder.onstop = null; recorder.stop(); } } catch {}
    recorder = null;
    if (navigator.vibrate) navigator.vibrate(20);
    setMode("listening", "Talking — let go when you're done");
    $("you").textContent = "…";
    if (canHear && mic && window.MediaRecorder) {
      const type = clipType();
      holdChunks = [];
      try {
        holdRec = new MediaRecorder(mic, type ? { mimeType: type } : undefined);
        holdRec.ondataavailable = (e) => e.data && e.data.size && holdChunks.push(e.data);
        holdRec.start(200);
      } catch { holdRec = null; }
      clearInterval(vadTimer);
      vadTimer = setInterval(() => { const v = loudness(); if (v > 0) kick(Math.min(1, v * 10)); }, 60);
    } else if (Rec) {
      recognize();
    }
  }
  function finishHold() {
    holding = false;
    clearInterval(vadTimer); vadTimer = null;
    setTimeout(() => (suppressClick = false), 80);
    if (holdRec) {
      const rec = holdRec;
      holdRec = null;
      rec.onstop = async () => {
        const blob = holdChunks.length ? new Blob(holdChunks, { type: holdChunks[0].type || "audio/webm" }) : null;
        if (!blob || blob.size < 1200 || !inCall) return listen();
        setMode("thinking", "Working out what you said…");
        try {
          const r = await fetch("hear", { method: "POST", headers: { "Content-Type": blob.type }, body: blob });
          const v = await r.json();
          if (v.error || !(v.text || "").trim()) return listen();
          ask(v.text.trim());
        } catch { listen(); }
      };
      try { rec.stop(); } catch { listen(); }
    } else if (recog) {
      try { recog.stop(); } catch {}
    } else listen();
  }
  const orbWrap = $("orb-wrap");
  orbWrap.addEventListener("pointerdown", () => {
    if (!inCall) return;
    clearTimeout(holdTimer);
    holdTimer = setTimeout(startHold, 350);
  });
  const endPress = () => {
    clearTimeout(holdTimer);
    if (holding) finishHold();
  };
  orbWrap.addEventListener("pointerup", endPress);
  orbWrap.addEventListener("pointercancel", endPress);
  orbWrap.addEventListener("pointerleave", endPress);
  orbWrap.addEventListener("contextmenu", (e) => e.preventDefault());

  $("orb-wrap").addEventListener("click", () => {
    if (suppressClick) { suppressClick = false; return; }
    if (mode === "speaking") return hush();
    if (!inCall) return startCall();
    if (talkAbort) return cancelThinking();
    // A tap is what a phone needs to start listening again.
    if (needTap) {
      needTap = false;
      makeAudioContext();
      if (canHear && mic) return hearTurn();
      if (Rec) return recognize();
      return listen();
    }
    if (sendNow) return sendNow();
    if (recorder && recorder.state !== "inactive") return recorder.stop();
  });
  $("kbd").addEventListener("click", () => {
    const f = $("typed");
    f.hidden = !f.hidden;
    if (!f.hidden) $("text").focus();
  });
  $("typed").addEventListener("submit", (e) => {
    e.preventDefault();
    const txt = $("text").value.trim();
    if (!txt || busy) return;
    $("text").value = "";
    unlockAudio();
    // Typed while the mic waits: drop that turn and answer this.
    needTap = false;
    clearInterval(vadTimer); vadTimer = null; sendNow = null;
    try { if (recog) recog.abort(); } catch {}
    try { if (recorder && recorder.state !== "inactive") { recorder.onstop = null; recorder.stop(); } } catch {}
    recorder = null;
    ask(txt);
  });
  $("history").addEventListener("click", () => ($("sheet").hidden = false));
  $("close-sheet").addEventListener("click", () => ($("sheet").hidden = true));
  $("sheet").addEventListener("click", (e) => { if (e.target.id === "sheet") $("sheet").hidden = true; });
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && inCall && keepAwake());
})();
</script>
</body>
</html>
