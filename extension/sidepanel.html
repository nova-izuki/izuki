<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Izuki</title>
  <style>
    :root {
      --bg: #0b0a14; --panel: #12101f; --card: #171429; --line: #2a2644; --ink: #f4f1fb; --muted: #a9a4c2;
      --violet: #7c5cff; --cyan: #4ecdc4; --bad: #fca5a5; --ok: #34d399;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f7f6fc; --panel: #ffffff; --card: #f0eef9; --line: #dcd8ee; --ink: #17142a; --muted: #625d7d; --bad: #b91c1c; --ok: #047857; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
    header img { width: 22px; height: 22px; }
    header b { font-size: 15px; }
    #state { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    #state i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: inline-block; }
    #state.on i { background: var(--ok); } #state.off i { background: #fbbf24; }
    .grow { flex: 1; }
    .icon { background: none; border: 1px solid transparent; color: var(--muted); border-radius: 8px; padding: 4px 8px; cursor: pointer; font: inherit; font-size: 12px; }
    .icon:hover { color: var(--ink); border-color: var(--line); }

    #context { margin: 10px 12px 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); display: flex; flex-direction: column; gap: 6px; }
    .page { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .page img { width: 16px; height: 16px; flex: none; }
    .page span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
    .switch { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); cursor: pointer; user-select: none; }
    .switch input { accent-color: var(--violet); }
    .tabs { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { font: inherit; font-size: 11.5px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 2px 9px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .chip.on { border-color: var(--violet); background: color-mix(in srgb, var(--violet) 18%, transparent); }
    .chip:hover { border-color: var(--violet); }

    #log { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
    .hello { margin: auto 0; text-align: center; color: var(--muted); }
    .hello h1 { font-size: 20px; margin: 0 0 4px; color: var(--ink); background: linear-gradient(135deg, var(--violet), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .ideas { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; text-align: left; }
    .ideas button { font: inherit; font-size: 13px; text-align: left; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; }
    .ideas button:hover { border-color: var(--violet); }
    .msg { max-width: 100%; padding: 9px 12px; border-radius: 14px; word-wrap: break-word; }
    .me { align-self: flex-end; background: linear-gradient(135deg, var(--violet), #5b8cff); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }
    .it { align-self: stretch; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
    .it.bad { color: var(--bad); }
    .it p { margin: 0 0 6px; } .it p:last-child { margin: 0; }
    .it ul { margin: 2px 0 6px; padding-left: 18px; }
    .it a { color: var(--cyan); }
    .it code { background: color-mix(in srgb, var(--violet) 14%, transparent); padding: 0 4px; border-radius: 4px; }
    .acts { display: flex; gap: 4px; margin-top: 6px; }
    .divider { align-self: center; font-size: 11px; color: var(--muted); border: 1px dashed var(--line); border-radius: 999px; padding: 1px 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dots span { display: inline-block; width: 6px; height: 6px; margin-right: 3px; border-radius: 50%; background: var(--cyan); animation: b 1s infinite ease-in-out; }
    .dots span:nth-child(2) { animation-delay: .15s; } .dots span:nth-child(3) { animation-delay: .3s; }
    @keyframes b { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

    form { display: flex; gap: 6px; align-items: flex-end; padding: 10px 12px 12px; border-top: 1px solid var(--line); background: var(--panel); }
    textarea { flex: 1; min-width: 0; resize: none; max-height: 140px; font: inherit; font-size: 13.5px; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); outline: none; }
    textarea:focus { border-color: var(--violet); }
    #send { flex: none; width: 38px; height: 38px; border-radius: 12px; border: 0; cursor: pointer; color: #fff; font-size: 16px; background: linear-gradient(135deg, var(--violet), var(--cyan)); }
    #send:disabled { opacity: .5; cursor: default; }
    small { display: block; padding: 0 12px 8px; color: var(--muted); font-size: 11px; background: var(--panel); }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" />
    <b>Izuki</b>
    <span id="state">· checking</span>
    <span class="grow"></span>
    <button class="icon" id="new" title="Start a new chat">＋ New chat</button>
  </header>

  <section id="context" aria-label="What Izuki can see">
    <div class="page"><img id="fav" alt="" /><span id="ptitle">This page</span></div>
    <label class="switch"><input type="checkbox" id="share" checked /> Share this page with Izuki</label>
    <div class="tabs" id="tabs" aria-label="Add other tabs"></div>
  </section>

  <main id="log" aria-live="polite"></main>

  <form id="ask">
    <textarea id="q" rows="1" placeholder="Ask about this page…" autocomplete="off"></textarea>
    <button id="send" type="submit" title="Ask (Enter)">➤</button>
  </form>
  <small>Answers come from Izuki on this PC, with your own AI. Nothing else leaves it.</small>
  <script src="sidepanel.js"></script>
</body>
</html>
