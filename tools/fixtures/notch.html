<!doctype html><html><head><meta charset="utf-8"><title>Notch review fixture</title></head>
<body style="margin:0;background:white"><div id="root"></div><script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { flushSync } from 'react-dom';
import { Island } from '/src/components/Island.tsx';
import { api, on, EV } from '/src/lib/ipc.ts';
import '/src/styles.css';
api.islandStatus=async()=>({suggestions:[],clip:[],copies:[]});
api.remindersList=async()=>[];
api.islandRecentApps=async()=>[];
window.notchEvents=[];
on(EV.islandPlace,p=>window.notchEvents.push(p));
const root=createRoot(document.getElementById('root'));
window.mountNotch=(props={})=>flushSync(()=>root.render(React.createElement(Island,{orb:'hidden',doing:null,thinking:false,look:'notch',animated:false,peeks:false,...props})));
mountNotch(); window.notchReady=true;
</script></body></html>
