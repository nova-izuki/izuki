    <circle r="112" fill="url(#core)"/>
    <circle r="112" fill="url(#shine)"/>
    <circle r="112" fill="none" stroke="url(#title)" stroke-opacity="0.7" stroke-width="1.6"/>
  </g>

  <!-- words -->
  <g font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="88" y="150" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-2">Izuki</text>
    <text x="90" y="202" font-size="30" font-weight="600" fill="#e2e8f0">The AI companion that lives on your screen.</text>
    <text x="90" y="244" font-size="20" fill="#94a3b8">Talk to it. It sees your screen, answers out loud — and does the work.</text>

    <g font-size="16" font-weight="600">
      <rect x="90" y="286" width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="175" y="310" text-anchor="middle" fill="#a5f3fc">Hands-free voice</text>
      <rect x="274" y="286" width="178" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#a5b4fc" stroke-opacity="0.45"/>
      <text x="363" y="310" text-anchor="middle" fill="#c7d2fe">Sees your screen</text>
      <rect x="466" y="286" width="170" height="38" rx="19" fill="#ffffff" fill-opacity="0.06" stroke="#f0abfc" stroke-opacity="0.45"/>
      <text x="551" y="310" text-anchor="middle" fill="#f5d0fe">Does the work</text>
    </g>
    <text x="90" y="372" font-size="15" fill="#64748b">Free · Open source · Windows (macOS &amp; Linux coming soon)</text>
  </g>
</svg>
