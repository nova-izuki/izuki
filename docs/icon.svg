<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>IZUKI NOVA</title>
  <!-- The IZUKI NOVA mark: the glass orb from the official profile picture,
       drawn as vector shapes so it stays crisp from a 16-pixel favicon to
       the app icon. Teal, violet and pink glass overlap on deep navy, inside
       a thin ring. tools/brand-icons.cjs renders every icon size from it. -->
  <defs>
    <radialGradient id="ground" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#1a2150"/>
      <stop offset="0.62" stop-color="#0a0d22"/>
      <stop offset="1" stop-color="#04050c"/>
    </radialGradient>
    <radialGradient id="teal" cx="0.38" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#b8fff6"/>
      <stop offset="0.45" stop-color="#3fe6d6"/>
      <stop offset="1" stop-color="#169fbf" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="pink" cx="0.6" cy="0.62" r="0.7">
      <stop offset="0" stop-color="#ffc2e6"/>
      <stop offset="0.5" stop-color="#ff5caa"/>
      <stop offset="1" stop-color="#b4307a" stop-opacity="0.2"/>
    </radialGradient>
    <radialGradient id="violet" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#e7dcff"/>
      <stop offset="0.5" stop-color="#9a7bff"/>
      <stop offset="1" stop-color="#5a46d8" stop-opacity="0.3"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#f3e9ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ffcf0"/>
      <stop offset="0.5" stop-color="#b7a1ff"/>
      <stop offset="1" stop-color="#ff8cc6"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#ground)"/>
    <g id="orb">
      <circle cx="256" cy="256" r="178" fill="none" stroke="url(#ring)" stroke-width="10" stroke-opacity="0.85"/>
      <circle cx="238" cy="234" r="136" fill="url(#teal)" fill-opacity="0.9"/>
      <circle cx="276" cy="280" r="136" fill="url(#pink)" fill-opacity="0.82"/>
      <circle cx="258" cy="254" r="132" fill="url(#violet)" fill-opacity="0.72"/>
      <circle cx="250" cy="250" r="96" fill="url(#core)" fill-opacity="0.85"/>
      <ellipse cx="200" cy="176" rx="50" ry="26" fill="#ffffff" fill-opacity="0.45" transform="rotate(-28 206 182)"/>
    </g>
  </g>
</svg>
